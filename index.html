<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Registro de Gastos</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg-dark: #050505;
      --card-bg: #0A0F12;
      --text-main: #FFFFFF;
      --text-muted: #7E8C9A;
      --neon-green: #00FF87;
      --neon-green-glow: rgba(0, 255, 135, 0.15);
      --border-color: #1A2228;
      --input-bg: #12181D;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 420px; padding: 30px 20px; box-sizing: border-box; }
    .header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
    .header h1 { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
    .header h1 span { color: var(--neon-green); text-shadow: 0 0 12px var(--neon-green-glow); }
    .header p { color: var(--text-muted); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; }

    .tabs { display: flex; background-color: var(--input-bg); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; text-align: center; padding: 12px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
    .tab-btn.active { background-color: var(--card-bg); color: var(--neon-green); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card-title { font-size: 20px; font-weight: bold; margin-top: 0; margin-bottom: 8px; }
    .card-title span { color: var(--neon-green); }
    .card-desc { color: var(--text-muted); font-size: 13px; line-height: 1.5; margin-bottom: 20px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--neon-green); font-weight: 600; }
    input, select { width: 100%; padding: 14px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 15px; box-sizing: border-box; outline: none; -webkit-appearance: none; }
    input:focus, select:focus { border-color: var(--neon-green); }
    ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; }

    button { width: 100%; padding: 16px; background-color: transparent; color: var(--neon-green); border: 1px solid var(--neon-green); border-radius: 8px; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 5px; transition: all 0.3s ease; }
    button:hover, button:active { background-color: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green-glow); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .historico-container { margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    .historico-container h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .historico-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #141A20; font-size: 13px; }
    .historico-item:last-child { border-bottom: none; }
    .val-despesa { color: #FF453A; }
    .val-receita { color: var(--neon-green); }
    
    /* Novos estilos para o Painel KPI */
    .kpi-container { display: flex; gap: 8px; margin-bottom: 20px; }
    .kpi-box { flex: 1; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 6px; text-align: center; }
    .kpi-label { display: block; font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .kpi-value { font-size: 13px; font-weight: bold; color: var(--text-main); }
    .kpi-value.highlight { color: var(--neon-green); }

    .chart-container { position: relative; height: 260px; width: 100%; }
    .loading-text { text-align: center; color: var(--neon-green); font-size: 12px; margin-top: 20px; display: none; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>TRACK<span>M7</span></h1>
      <p>Controle de Gastos</p>
    </div>

    <!-- Navegação -->
    <div class="tabs">
      <div class="tab-btn active" id="btnTabRegistro" onclick="switchTab('registro')">Operação</div>
      <div class="tab-btn" id="btnTabDashboard" onclick="switchTab('dashboard')">Performance</div>
    </div>

    <!-- ABA 1: REGISTRO -->
    <div id="tab-registro" class="tab-content active">
      <div class="card">
        <h2 class="card-title">Painel do <span>Lucas</span></h2>
        <p class="card-desc">Lançamento de fluxo de caixa para banco de dados.</p>
        
        <form id="expenseForm">
          <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="descricao" required placeholder="Ex: Manutenção, Setup, etc...">
          </div>
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="valor" required placeholder="0.00">
          </div>
          
          <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
              <label>Tipo</label>
              <select id="tipo">
                <option value="Despesa">Despesa</option>
                <option value="Receita">Receita</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label>Data</label>
              <input type="date" id="data">
            </div>
          </div>

          <div class="form-group">
            <label>Categoria</label>
            <select id="categoria">
              <option value="Alimentação">Alimentação</option>
              <option value="Fast Food">Fast Food</option>
              <option value="Transporte">Transporte / Combustível</option>
              <option value="Manutenção Automotiva">Manutenção Automotiva</option>
              <option value="Saúde e Academia">Saúde e Academia</option>
              <option value="Barbearia e Cuidados">Barbearia e Cuidados</option>
              <option value="Cursos e Educação">Cursos e Educação</option>
              <option value="Plataformas e Trading">Plataformas e Trading</option>
              <option value="Tecnologia e Periféricos">Tecnologia e Periféricos</option>
              <option value="Vestuário">Vestuário / Sneakers</option>
              <option value="Moradia">Moradia / Assinaturas</option>
              <option value="Lazer">Lazer</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
          
          <button type="submit" id="btnSalvar">Registrar Operação &rarr;</button>
        </form>

        <div class="historico-container">
          <h3>Sessão Atual</h3>
          <div id="listaHistorico">
            <div style="color: #4A5560; font-size: 12px; text-align: center; padding: 10px;">Nenhum lançamento recente.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ABA 2: DASHBOARD KPI -->
    <div id="tab-dashboard" class="tab-content">
      <div class="card">
        <h2 class="card-title">Métricas de <span><span id="mesAtualNome"></span></span></h2>
        
        <div id="loadingDash" class="loading-text">Sincronizando com Banco de Dados...</div>
        
        <!-- Painel de Performance (KPIs) -->
        <div class="kpi-container" id="painelKPI" style="display: none;">
          <div class="kpi-box">
            <span class="kpi-label">Base Fixa</span>
            <span class="kpi-value" id="kpiFixo">R$ 0,00</span>
          </div>
          <div class="kpi-box">
            <span class="kpi-label">Custo Variável</span>
            <span class="kpi-value" id="kpiVariavel">R$ 0,00</span>
          </div>
          <div class="kpi-box">
            <span class="kpi-label">Maior Gasto</span>
            <span class="kpi-value highlight" id="kpiMaior">-</span>
          </div>
        </div>

        <!-- Gráfico de Barras -->
        <div class="chart-container">
          <canvas id="graficoDespesas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbz8JEEpufTVBE-c_SXgn9MaVTSE9LK3BTrOmuTFuwfwH0YdVvidj4_FkZrFFNSQHGI/exec"; 
    
    const nomeMeses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    document.getElementById('mesAtualNome').innerText = nomeMeses[new Date().getMonth()];
    
    document.getElementById('data').valueAsDate = new Date();
    let meuGrafico = null; 

    function switchTab(tab) {
      document.getElementById('tab-registro').classList.remove('active');
      document.getElementById('tab-dashboard').classList.remove('active');
      document.getElementById('btnTabRegistro').classList.remove('active');
      document.getElementById('btnTabDashboard').classList.remove('active');

      if (tab === 'registro') {
        document.getElementById('tab-registro').classList.add('active');
        document.getElementById('btnTabRegistro').classList.add('active');
      } else {
        document.getElementById('tab-dashboard').classList.add('active');
        document.getElementById('btnTabDashboard').classList.add('active');
        carregarDashboard();
      }
    }

    function atualizarHistoricoVisual() {
      const history = JSON.parse(localStorage.getItem('trackM7_historico') || '[]');
      const lista = document.getElementById('listaHistorico');
      if (history.length === 0) return;
      
      lista.innerHTML = '';
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'historico-item';
        const cssClass = item.tipo === 'Despesa' ? 'val-despesa' : 'val-receita';
        const sinal = item.tipo === 'Despesa' ? '-' : '+';
        
        div.innerHTML = `
          <span style="color: var(--text-main); font-weight: 500;">${item.descricao} <span style="color: var(--text-muted); font-size: 10px; margin-left: 5px;">(${item.categoria})</span></span>
          <span class="${cssClass}">${sinal} R$ ${Number(item.valor).toFixed(2)}</span>
        `;
        lista.appendChild(div);
      });
    }
    atualizarHistoricoVisual();

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      const originalText = btn.innerHTML;
      btn.innerHTML = "PROCESSANDO...";
      btn.disabled = true;

      const payload = {
        descricao: document.getElementById('descricao').value,
        valor: document.getElementById('valor').value,
        categoria: document.getElementById('categoria').value,
        tipo: document.getElementById('tipo').value,
        data: document.getElementById('data').value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        let history = JSON.parse(localStorage.getItem('trackM7_historico') || '[]');
        history.unshift(payload);
        if (history.length > 5) history.pop(); 
        localStorage.setItem('trackM7_historico', JSON.stringify(history));
        atualizarHistoricoVisual();

        btn.innerHTML = "OPERAÇÃO CONCLUÍDA!";
        btn.style.backgroundColor = "var(--neon-green)";
        btn.style.color = "#000";
        
        setTimeout(() => {
          document.getElementById('descricao').value = "";
          document.getElementById('valor').value = "";
          btn.innerHTML = originalText;
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--neon-green)";
          btn.disabled = false;
        }, 2000);
        
      } catch (err) {
        alert("Erro na conexão: " + err.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    Chart.defaults.color = '#7E8C9A';
    Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, sans-serif';

    async function carregarDashboard() {
      const loading = document.getElementById('loadingDash');
      const painelKPI = document.getElementById('painelKPI');
      const ctx = document.getElementById('graficoDespesas').getContext('2d');
      
      loading.style.display = 'block';
      painelKPI.style.display = 'none';
      if (meuGrafico) meuGrafico.destroy(); 
      
      try {
        const response = await fetch(API_URL);
        const json = await response.json(); 
        
        let totaisCategoria = {};
        let totalFixoCalc = 0;
        let totalVarCalc = 0;
        
        const dataAtual = new Date();
        const mesAtual = dataAtual.getMonth();
        const anoAtual = dataAtual.getFullYear();

        // Cálculo dos Fixos
        if(json.fixos && json.fixos.length > 0) {
          json.fixos.forEach(linha => {
            let keys = Object.keys(linha);
            let keyCat = keys.find(k => k.toLowerCase().includes('categoria'));
            let keyVal = keys.find(k => k.toLowerCase().includes('valor'));
            
            let categoria = keyCat ? linha[keyCat] : 'Custos Fixos';
            let valor = keyVal ? Number(linha[keyVal]) : 0;
            
            if (valor > 0) {
              totaisCategoria[categoria] = (totaisCategoria[categoria] || 0) + valor;
              totalFixoCalc += valor;
            }
          });
        }

        // Cálculo dos Variáveis (Mês Atual)
        if(json.gastos && json.gastos.length > 0) {
          json.gastos.forEach(linha => {
            let keys = Object.keys(linha);
            let keyTipo = keys.find(k => k.toLowerCase().includes('tipo'));
            let keyCat = keys.find(k => k.toLowerCase().includes('categoria'));
            let keyVal = keys.find(k => k.toLowerCase().includes('valor'));
            let keyData = keys.find(k => k.toLowerCase().includes('data'));
            
            let tipo = keyTipo ? linha[keyTipo] : '';
            let categoria = keyCat ? linha[keyCat] : 'Outros';
            let valor = keyVal ? Number(linha[keyVal]) : 0;
            let dataGasto = keyData ? linha[keyData] : null;
            
            let isMesAtual = true;
            if (dataGasto) {
              let d = new Date(dataGasto);
              if (!isNaN(d)) {
                isMesAtual = (d.getMonth() === mesAtual && d.getFullYear() === anoAtual);
              }
            }
            
            if (tipo === 'Despesa' && valor > 0 && isMesAtual) {
              totaisCategoria[categoria] = (totaisCategoria[categoria] || 0) + valor;
              totalVarCalc += valor;
            }
          });
        }
        
        // Identificar a categoria com maior despesa para o KPI
        let maiorCatNome = "-";
        let maiorCatValor = 0;
        for (let cat in totaisCategoria) {
          if (totaisCategoria[cat] > maiorCatValor) {
            maiorCatValor = totaisCategoria[cat];
            maiorCatNome = cat;
          }
        }
        
        // Formatar e truncar o nome da maior categoria para caber na caixa
        if (maiorCatNome.length > 15) {
           maiorCatNome = maiorCatNome.substring(0, 13) + '...';
        }

        // Atualizar HTML dos KPIs
        document.getElementById('kpiFixo').innerText = totalFixoCalc > 0 ? 'R$' + totalFixoCalc.toFixed(0) : 'R$ 0';
        document.getElementById('kpiVariavel').innerText = totalVarCalc > 0 ? 'R$' + totalVarCalc.toFixed(0) : 'R$ 0';
        document.getElementById('kpiMaior').innerText = maiorCatNome;

        const labels = Object.keys(totaisCategoria);
        const valores = Object.values(totaisCategoria);
        
        const cores = ['#00FF87', '#00B8FF', '#FF0055', '#7B61FF', '#FFB800', '#FF3B30', '#34C759', '#AF52DE', '#FF9500', '#5AC8FA'];

        loading.style.display = 'none';

        if (valores.length === 0) {
          loading.style.display = 'block';
          loading.innerHTML = "Ainda não há despesas neste mês.";
          return;
        }
        
        painelKPI.style.display = 'flex';
        
        // Gráfico de Barras Vertical
        meuGrafico = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{ 
              label: 'Exposição (R$)',
              data: valores, 
              backgroundColor: cores, 
              borderRadius: 4 
            }]
          },
          options: {
            responsive: true, 
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }, 
              tooltip: {
                backgroundColor: 'rgba(10, 15, 18, 0.9)', 
                titleColor: '#00FF87', 
                padding: 12,
                callbacks: { label: function(context) { return ' R$ ' + (context.raw || 0).toFixed(2); } }
              }
            },
            scales: {
              x: { 
                grid: { display: false }, 
                ticks: { color: '#7E8C9A', font: { size: 9 }, maxRotation: 45, minRotation: 45 } 
              },
              y: { 
                grid: { color: '#1A2228' }, 
                ticks: { color: '#FFFFFF', font: { size: 10 } } 
              }
            }
          }
        });
        
      } catch (err) {
        loading.innerHTML = "Erro ao carregar dados. Verifique a conexão.";
      }
    }
  </script>
</body>
</html>
