<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Configurações essenciais para iPhone/PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="apple-touch-icon" href="icon-192.png"> <!-- Você precisará adicionar uma imagem com esse nome -->
  
  <link rel="manifest" href="manifest.json">
  <title>Registro de Gastos</title>
  
  <style>
    :root {
      --bg-dark: #050505;
      --card-bg: #0A0F12;
      --text-main: #FFFFFF;
      --text-muted: #7E8C9A;
      --neon-green: #00FF87;
      --neon-green-glow: rgba(0, 255, 135, 0.15);
      --border-color: #1A2228;
      --input-bg: #12181D;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    /* Cabeçalho inspirado na imagem */
    .header {
      text-align: center;
      margin-bottom: 40px;
      margin-top: 20px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0;
    }

    .header h1 span {
      color: var(--neon-green);
      text-shadow: 0 0 12px var(--neon-green-glow);
    }

    .header p {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 10px;
    }

    /* Estilo do Card principal */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 8px;
    }
    
    .card-title span {
      color: var(--neon-green);
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--neon-green);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
      -webkit-appearance: none;
    }

    input:focus, select:focus {
      border-color: var(--neon-green);
    }

    /* Ícone de calendário escuro */
    ::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.6;
    }

    button {
      width: 100%;
      padding: 16px;
      background-color: transparent;
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s ease;
    }

    button:hover, button:active {
      background-color: var(--neon-green);
      color: #000;
      box-shadow: 0 0 15px var(--neon-green-glow);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Tags no estilo da imagem */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tag {
      font-size: 10px;
      padding: 5px 10px;
      border: 1px solid #2A3238;
      border-radius: 4px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>TRACK<span>M7</span></h1>
      <p>Controle que opera por você</p>
    </div>

    <div class="card">
      <h2 class="card-title">R$ Log <span>Entry</span></h2>
      <p class="card-desc">Registro rápido de fluxo de caixa. Alta precisão para quem busca resultado. <strong>Sempre atualizado.</strong></p>
      
      <div class="tags">
        <span class="tag">BRL/USD</span>
        <span class="tag">MANUAL HFT</span>
        <span class="tag">DESDE 2026</span>
      </div>

      <form id="expenseForm">
        <div class="form-group">
          <label>Descrição</label>
          <input type="text" id="descricao" required placeholder="Ex: Combustível">
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" step="0.01" id="valor" required placeholder="0.00">
        </div>
        
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>Tipo</label>
            <select id="tipo">
              <option value="Despesa">Despesa</option>
              <option value="Receita">Receita</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Data</label>
            <input type="date" id="data">
          </div>
        </div>

        <div class="form-group">
          <label>Categoria</label>
          <select id="categoria">
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Assinaturas">Assinaturas</option>
            <option value="Compras">Compras</option>
            <option value="Lazer">Lazer</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        
        <button type="submit" id="btnSalvar">Registrar Operação &rarr;</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Registro do Service Worker para o PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado!', reg))
          .catch(err => console.log('Erro ao registrar Service Worker', err));
      });
    }

    // 2. Lógica de Envio para o Google Sheets
    const API_URL = "SUA_URL_DO_APPS_SCRIPT_AQUI"; // Cole a URL gerada no Google Sheets
    document.getElementById('data').valueAsDate = new Date();

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      const originalText = btn.innerHTML;
      btn.innerHTML = "PROCESSANDO...";
      btn.disabled = true;

      const payload = {
        descricao: document.getElementById('descricao').value,
        valor: document.getElementById('valor').value,
        categoria: document.getElementById('categoria').value,
        tipo: document.getElementById('tipo').value,
        data: document.getElementById('data').value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        btn.innerHTML = "OPERAÇÃO CONCLUÍDA!";
        btn.style.backgroundColor = "var(--neon-green)";
        btn.style.color = "#000";
        
        setTimeout(() => {
          document.getElementById('descricao').value = "";
          document.getElementById('valor').value = "";
          btn.innerHTML = originalText;
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--neon-green)";
          btn.disabled = false;
        }, 2000);
        
      } catch (err) {
        alert("Erro na execução: " + err.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
